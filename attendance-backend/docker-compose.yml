services:
  mysql:
    image: mysql:8.4
    container_name: attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: attendance
      MYSQL_USER: attendance_app
      MYSQL_PASSWORD: attendance_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - attendance_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uattendance_app", "-pattendance_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  attendance_mysql_data:
